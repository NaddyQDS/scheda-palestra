function sug(n,h){const x=Object.values(P).flat().find(y=>y[0]==n||y[5]==n);if(!x||h.length<2)return'';const r=x[1][x[1].length-1],st=x[3]||2.5,a=h[h.length-1],b=h[h.length-2];if(a.k>=r&&b.k>=r)return`<div class="c"><b>Suggerimento:</b> hai raggiunto le ripetizioni previste per due sedute di fila. Prossima volta prova ${a.w+st} kg.</div>`;if(h.length>=3&&h.slice(-3).every(y=>y.w==a.w))return`<div class="c"><b>Suggerimento:</b> carico fermo da 3 sedute a ${a.w} kg. Valuta una settimana più leggera o un’alternativa.</div>`;return'<div class="c m">Nessun cambio di carico suggerito per ora.</div>'}

const BF=[['peso','Peso (kg)'],['gr','Grasso (%)'],['ms','Muscolo scheletrico (kg)'],['ac','Acqua (%)'],['vi','Grasso viscerale'],['vita','Vita (cm)'],['fia','Fianchi (cm)'],['pet','Petto (cm)'],['spa','Spalle (cm)'],['bic','Bicipite (cm)'],['qua','Quadricipite (cm)'],['pol','Polpaccio (cm)']];
function addB(){const o={dt:oggi()};BF.forEach(([k])=>{const v=$('#b_'+k).value;if(v!=='')o[k]=+v});if(Object.keys(o).length>1){D.body.push(o);save();R()}}
function vBody(){const b=D.body;return`<h2>Corpo</h2><div class="c">`+BF.map(([k,l])=>`<label class="f">${l}<input id="b_${k}" type="number" step=".1" inputmode="decimal"></label>`).join('')+`<button class="b p" onclick="addB()">Salva misure</button></div><div class="c"><small class="m">Andamento del peso</small>${sp(b.map(x=>x.peso).filter(Boolean))}</div>`+b.slice().reverse().map((x,i)=>{const ix=b.length-1-i,w=b.slice(Math.max(0,ix-6),ix+1).map(y=>y.peso).filter(Boolean),av=w.length?(w.reduce((a,y)=>a+y,0)/w.length).toFixed(1):'–';return`<div class="c"><b>${x.dt}</b> <span class="m">media mobile del peso: ${av} kg</span><br><small>${BF.filter(([k])=>x[k]!==undefined).map(([k,l])=>l.split(' (')[0]+' '+x[k]).join(', ')}</small></div>`}).join('')}
function addC(){const o={dt:oggi(),t:$('#c_t').value,m:+$('#c_m').value||0,km:+$('#c_k').value||0,up:+$('#c_u').value||0};if(o.m||o.km){D.car.push(o);save();R()}}
function vCar(){const l=new Date();l.setDate(l.getDate()-((l.getDay()+6)%7));const w=D.car.filter(x=>x.dt>=l.toISOString().slice(0,10)).length;
return`<h2>Cardio</h2><p class="m">Questa settimana: ${w} ${w==1?'uscita':'uscite'}. Obiettivo: 1, senza penalità se il meteo non lo permette.</p><div class="c"><label class="f">Tipo<select id="c_t"><option>Corsa</option><option>Camminata</option><option>Trekking</option><option>Indoor (tapis roulant)</option><option>Indoor (camminata inclinata)</option></select></label><label class="f">Durata (min)<input id="c_m" type="number" inputmode="numeric"></label><label class="f">Distanza (km)<input id="c_k" type="number" step=".1" inputmode="decimal"></label><label class="f">Dislivello (m)<input id="c_u" type="number" inputmode="numeric"></label><button class="b p" onclick="addC()">Salva uscita</button></div>`+D.car.slice().reverse().map(x=>`<div class="c r"><span>${x.dt}, ${x.t}</span><span>${x.m} min, ${x.km} km, +${x.up} m</span></div>`).join('')}
const G=[{t:'Grasso corporeo',k:'gr',u:'%',tg:15,dl:'2027-06-01',ms:[['2027-01-01',21],['2027-03-01',18.5],['2027-04-15',16.5]]},{t:'Peso',k:'peso',u:'kg',tg:74,dl:'2027-06-01'},{t:'Vita',k:'vita',u:'cm',rel:-6,dl:'2027-06-01'},{t:'Muscolo scheletrico',k:'ms',u:'kg',tg:33,dl:'2027-06-01'},{t:'Bench press, serie più pesante',ex:'Bench press',u:'kg per lato',tg:37.5,dl:'2026-12-28'},{t:'Incline row, serie più pesante',ex:'Incline row stretta',u:'kg per lato',tg:50,dl:'2026-12-28'},{t:'Linear hack press, serie più pesante',ex:'Linear hack press',u:'kg per lato',tg:45,dl:'2026-12-28'}];
const dt2=s=>new Date(s+'T12:00:00'),fd=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
function gser(g){return g.k?D.body.filter(x=>x[g.k]!==undefined).map(x=>[x.dt,x[g.k]]):D.ses.flatMap(s=>s.ex.filter(e=>e.n==g.ex).map(e=>[s.dt,e.w]))}
function gcard(g){const s=gser(g);if(!s.length)return`<div class="c"><b>${g.t}</b><br><small class="m">Servono dati per partire: registra la prima misura.</small></div>`;const [d0,v0]=s[0],v=s[s.length-1][1],tg=g.tg??(v0+g.rel),now=Date.now(),sd=dt2(d0),dl=dt2(g.dl),p=(v-v0)/(tg-v0),el=Math.max(.01,(now-sd)/(dl-sd)),stt=p>=1?'Raggiunto':p>=el*1.1?'In anticipo':p>=el*.8?'In linea':'In ritardo',pr=p>0&&p<1?fd(new Date(+sd+(now-sd)/p)):'',nx=(g.ms||[]).find(m=>tg<v0?v>m[1]:v<m[1]);return`<div class="c"><div class="r"><b>${g.t}</b><span class="g ${p>=1?'on':''}">${stt}</span></div><small class="m">Partenza ${v0}, attuale ${v}, obiettivo ${tg} ${g.u} entro ${fd(dl)}</small><div class="bar"><i style="width:${Math.max(0,Math.min(100,p*100))}%"></i></div><small class="m">Avanzamento ${Math.round(Math.max(0,p*100))}%, tempo trascorso ${Math.round(Math.min(1,el)*100)}%${pr?'. Data prevista al ritmo attuale: '+pr:''}${nx?'. Prossima tappa: '+nx[1]+' '+g.u+' entro '+fd(dt2(nx[0])):''}</small>${stt=='In ritardo'?'<br><small>Valuta di rivedere la tappa.</small>':''}</div>`}
function vOb(){const w=D.ses.filter(s=>s.dt>=dAgo(28)).length,c=D.car.filter(x=>x.dt>=dAgo(28)).length;return`<h2>Obiettivi</h2><p class="m">Proposti da Claude in base ai tuoi dati, con traguardo a giugno 2027. Valori indicativi, da rivedere ogni 8-12 settimane.</p>`+G.map(gcard).join('')+`<div class="c"><div class="r"><b>Costanza</b><span class="g ${w>=10?'on':''}">${w>=10?'In linea':'Da recuperare'}</span></div><small class="m">Sedute di palestra negli ultimi 28 giorni: ${w} su 12 previste (obiettivo: almeno 10)</small></div><div class="c"><div class="r"><b>Cardio</b><span class="g ${c>=4?'on':''}">${c>=4?'In linea':'Flessibile'}</span></div><small class="m">Uscite negli ultimi 28 giorni: ${c} (obiettivo: 1 a settimana, senza penalità se il meteo non lo permette)</small></div>`}
function applyPlan(j){['A','B','C'].forEach(d=>{P[d]=j.giorni[d].map(e=>[e.n,e.r,e.w,e.s??2.5,e.l?1:0,e.alt||'Alternativa'])})}
function chk(j){try{for(const d of['A','B','C']){const a=j.giorni[d];if(!Array.isArray(a)||!a.length)return'Manca il giorno '+d;for(const e of a)if(typeof e.n!='string'||!Array.isArray(e.r)||!e.r.length||e.r.some(x=>typeof x!='number')||typeof e.w!='number')return'Esercizio non valido nel giorno '+d+': '+(e.n||'?')}return''}catch(e){return'Formato non riconosciuto'}}
function imp(){const t=$('#ti').value.trim(),m=t.match(/\{[\s\S]*\}/);try{const j=JSON.parse(m?m[0]:t),er=chk(j);if(er){alert(er);return}D.plan=j;D.cur=null;D.next=0;applyPlan(j);save();R();alert('Scheda importata')}catch(e){alert('JSON non valido')}}
function cp(id){const t=$('#'+id);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(x){}}}
function riep(){const o=$('#q_o').value,du=$('#q_d').value,li=$('#q_l').value||'nessuna',b=D.body[D.body.length-1]||{},
top=[...new Set(D.ses.flatMap(s=>s.ex.map(e=>e.n)))].map(n=>{const h=D.ses.flatMap(s=>s.ex.filter(e=>e.n==n)),l=h[h.length-1];return n+': '+l.w+' kg x '+l.k}).join('; ');
$('#tx').value=`Ciao Claude, sono Cristian. Preparami una nuova scheda di allenamento.
Obiettivo: ${o}. Palestra 3 volte a settimana (giorni A, B, C, full-body) più 1 uscita cardio. Durata massima per seduta: ${du} minuti. Limitazioni fisiche: ${li}.
La palestra è spesso affollata: niente superset e per ogni esercizio indica un'alternativa.
Ultime misure: ${BF.filter(([k])=>b[k]!==undefined).map(([k,l])=>l+' '+b[k]).join(', ')||'nessuna'}.
Sedute registrate: ${D.ses.length}. Ultime serie più pesanti: ${top||'nessuna'}.
Rispondi con una breve spiegazione e poi con un unico blocco JSON in questo formato: {"nome":"...","giorni":{"A":[{"n":"Esercizio","r":[12,10,8,8],"w":40,"s":2.5,"l":0,"alt":"Alternativa"}],"B":[],"C":[]}}. r = ripetizioni per serie, w = carico della prima serie, s = incremento per serie (0 se fisso), l = 1 se il carico è per lato.`}
function gprog(g){const s=gser(g);if(!s.length)return null;const v0=s[0][1],v=s[s.length-1][1],tg=g.tg??(v0+g.rel);return(v-v0)/(tg-v0)}
function vHome(){const c=D.cur,n='ABC'[D.next%3],l=new Date();l.setDate(l.getDate()-((l.getDay()+6)%7));const mon=l.toISOString().slice(0,10),sw=D.ses.filter(s=>s.dt>=mon).length,cw=D.car.filter(x=>x.dt>=mon).length,pv=D.body.filter(x=>x.peso),bw=pv[pv.length-1],gs=G.map(g=>[g,gprog(g)]).filter(x=>x[1]!==null&&x[1]<1).sort((a,b)=>b[1]-a[1]),g0=gs[0],lst=D.ses[D.ses.length-1],
k=(t,b,v,cx)=>`<div class="c k"><small class="m cap">${t}</small><div class="bar"><i style="width:${Math.max(0,Math.min(100,b*100))}%"></i></div><div class="big">${v}</div><small class="m cap">${cx}</small></div>`;
return`<h2>Oggi</h2><p class="m cap">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</p><div class="pn">`+(c?`<small class="cap">Seduta in corso</small><div class="big">GIORNO ${c.d}</div><button class="b p" onclick="go('all')">Continua</button>`:`<small class="cap">Prossima seduta</small><div class="big">GIORNO ${n}</div><small>${P[n].length} esercizi, circa ${Math.round(P[n].reduce((a,x)=>a+x[1].length,0)*2.5+10)} min</small><button class="b p" onclick="st('${n}');go('all')">Inizia</button>`)+`</div><div class="g2">`+k('Sedute',sw/3,sw,'di 3 questa settimana')+k('Cardio',cw,cw,'di 1 questa settimana')+(bw?k('Peso',gprog(G[1])??0,bw.peso,'kg'):'')+(g0?k(g0[0].t.split(',')[0],g0[1],Math.round(Math.max(0,g0[1]*100))+'%','avanzamento'):'')+'</div>'+(lst?`<div class="c"><small class="m cap">Ultima seduta</small><br><b>Giorno ${lst.d}, ${lst.dt}</b>: ${lst.min} min, ${lst.ex.length} esercizi</div>`:'')}
function vMore(){return`<h2>Altro</h2>`+[['car','Cardio','Uscite, corsa, trekking e indoor'],['ob','Obiettivi','Avanzamento e tappe'],['sch','Scheda','Scheda attuale e nuova scheda con Claude'],['dati','Dati e impostazioni','Backup, recupero, sincronizzazione']].map(([t,a,b])=>`<button class="b" onclick="go('${t}')"><b>${a}</b><br><small class="m">${b}</small></button>`).join('')}
function vSch(){return`<h2>Scheda</h2><p class="m">${D.plan?(D.plan.nome||'Scheda importata'):'Bozza iniziale full-body A/B/C'}. La modifica diretta degli esercizi arriverà nella versione completa.</p>`+['A','B','C'].map(d=>`<div class="c"><b>Giorno ${d}</b>`+P[d].map(x=>`<br><small>${x[0]}: ${x[1].join('/')}, da ${x[2]} kg${x[3]?' (+'+x[3]+' a serie)':' fisso'}${x[4]?', per lato':''}. Alt.: ${x[5]}</small>`).join('')+'</div>').join('')+`<h2>Nuova scheda con Claude</h2><div class="c"><label class="f">Obiettivo<select id="q_o"><option>Ricomposizione corporea</option><option>Massa muscolare</option><option>Forza</option></select></label><label class="f">Durata massima seduta (min)<select id="q_d"><option>60</option><option>45</option><option>75</option></select></label><label class="f">Limitazioni fisiche<input id="q_l" placeholder="nessuna"></label><button class="b p" onclick="riep()">Genera messaggio per Claude</button><textarea id="tx" rows="6"></textarea><button class="b" onclick="cp('tx')">Copia</button><a class="b" style="display:block;text-align:center;color:var(--tx)" href="https://claude.ai/new" target="_blank" rel="noopener">Apri Claude e incolla il messaggio</a></div><h2>Importa scheda</h2><div class="c"><textarea id="ti" rows="5" placeholder="Incolla qui il JSON ricevuto da Claude"></textarea><button class="b p" onclick="imp()">Importa scheda</button></div>`}
function rst(){try{const j=JSON.parse($('#tb').value);if(!Array.isArray(j.ses))throw 0;D=j;save();if(D.plan)applyPlan(D.plan);R();alert('Backup ripristinato')}catch(e){alert('Backup non valido')}}
function clr2(){{D={ses:[],body:REAL(),car:[],next:0,cur:null,demo:0};save();R()}}
function vDati(){return`<h2>Dati e impostazioni</h2><div class="c"><b>Sincronizzazione Drive</b><br><small class="m">${SY.url?'Attiva. '+(SY.msg||''):'Non attiva. I dati restano su questo telefono.'}</small><label class="f">URL Apps Script<input id="su" type="url" value="${SY.url||''}" placeholder="https://script.google.com/macros/s/.../exec"></label><label class="f">Token<input id="st" type="password" value="${SY.tok||''}"></label><button class="b" onclick="syCfg()">Salva e sincronizza</button><button class="b" onclick="sync(1)">Sincronizza ora</button></div><div class="c"><label class="f">Recupero predefinito (secondi)<input type="number" inputmode="numeric" value="${D.rest||90}" onchange="D.rest=+this.value||90;save()"></label></div><div class="c"><b>Backup</b><textarea id="tb" rows="5" placeholder="Il backup apparirà qui"></textarea><button class="b" onclick="$('#tb').value=JSON.stringify(D)">Genera backup</button><button class="b" onclick="cp('tb')">Copia</button><button class="b" onclick="rst()">Ripristina dal backup incollato</button></div><div class="c"><button class="b" id="c2" data-f="clr2" onclick="two(this)">Cancella tutti i dati</button></div>`}
if(D.plan)applyPlan(D.plan);

const armed={};function two(b){const id=b.id;if(armed[id]){armed[id]=0;window[b.dataset.f]();return}armed[id]=1;const l=b.textContent;b.textContent='Tocca di nuovo per confermare';setTimeout(()=>{armed[id]=0;b.textContent=l},4000)}function an(){D.cur=null;save();R()}function msg(t){let e=$('#ts');if(!e){e=document.createElement('div');e.id='ts';e.style.cssText='position:fixed;left:12px;right:12px;bottom:80px;padding:10px;border-radius:10px;background:var(--tx);color:var(--bg);text-align:center;z-index:9';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}window.alert=msg;function R(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==(['car','ob','sch','dati'].includes(tab)?'more':tab)));$('#v').innerHTML=(D.demo?'<div class="c m"><small>Dati di prova fittizi.</small> <button class="g" id="cl" data-f="clr" onclick="two(this)">Cancella dati di prova</button></div>':'')+{home:vHome,all:vAll,prog:vProg,body:vBody,car:vCar,ob:vOb,more:vMore,sch:vSch,dati:vDati}[tab]()}
setInterval(()=>{const c=D.cur;if(!c)return;const t=$('#tm'),r=$('#rs');if(t)t.textContent=fm(Math.floor((Date.now()-c.t0)/1000));if(r){const l=Math.ceil((rest-Date.now())/1000);r.textContent=l>0?fm(l):'PRONTO';r.classList.toggle('on2',l>0)}},1000);
sync();addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
R();
</script></body></html>
